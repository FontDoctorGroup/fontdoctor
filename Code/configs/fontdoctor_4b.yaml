# FontDoctor-4B configuration (paper defaults)
language:
  model_name_or_path: Qwen/Qwen3-4B
  hidden_size: 2560
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 9728
  vocab_size: 151936
  max_position_embeddings: 40960
  rope_theta: 1000000.0
  rms_norm_eps: 1.0e-6

# Character vision encoder E_v (Qwen2.5-VL-style native-resolution ViT)
char_vit:
  hidden_size: 1280
  depth: 32
  num_heads: 16
  intermediate_size: 3456
  patch_size: 14
  spatial_merge_size: 2
  window_size: 112
  fullatt_block_indexes: [7, 15, 23, 31]
  out_hidden_size: 2560
  deepstack_layer_indexes: [7, 15, 23]

# Frozen SVG optical-compression branch (official DeepSeek-OCR DeepEncoder)
ocr:
  image_size: 1024        # global view (Base mode)
  patch_image_size: 640   # local crops (Gundam mode)
  min_crops: 2
  max_crops: 9
  fused_dim: 2048
  n_embed: 2560
  freeze: true

# DeepStack injection into shallow decoder blocks (ablation: 3 is optimal)
deepstack_decoder_layers: [0, 1, 2]

# CCED: L = L_tok + lambda_coord * L_coord
lambda_coord: 1.0
coord_hidden_ratio: 1
coord_normalize: 512.0

# Few-shot template-referenced detection (K saturates at 6, paper Appendix)
max_reference_templates: 6
referenced_mode_prob: 0.5

# SVG XML code-image rendering (Algorithm 1)
svg_render_max_width: 512
svg_render_font_size: 14
svg_render_line_spacing: 4
